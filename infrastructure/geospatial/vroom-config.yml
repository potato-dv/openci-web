cliArgs:
  geometry: false
  planmode: false
  threads: 4
  explore: 5
  limit: 1mb
  logdir: ..
  logsize: 100M
  maxlocations: 100
  maxvehicles: 20
  override: ['l']
  path: ""
  port: 3000
  router: osrm
  timeout: 60000
  baseurl: /
routingServers:
  osrm:
    car:
      host: osrm
      port: "5000"
