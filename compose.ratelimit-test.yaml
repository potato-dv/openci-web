services:
  backend:
    environment:
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REDIS_URL: redis://redis:6379/15
      RATE_LIMIT_NAMESPACE: collector:ratelimit:test
      RATE_LIMIT_GENERAL_LIMIT: "30"
      RATE_LIMIT_GENERAL_WINDOW_SECONDS: "60"
      RATE_LIMIT_WRITE_LIMIT: "120"
      RATE_LIMIT_WRITE_WINDOW_SECONDS: "60"
      RATE_LIMIT_LOGIN_IP_LIMIT: "200"
      RATE_LIMIT_LOGIN_IP_WINDOW_SECONDS: "900"
      RATE_LIMIT_LOGIN_FAILURE_LIMIT: "5"
      RATE_LIMIT_LOGIN_FAILURE_WINDOW_SECONDS: "900"
      RATE_LIMIT_AUTH_SESSION_LIMIT: "30"
      RATE_LIMIT_AUTH_SESSION_WINDOW_SECONDS: "60"
      RATE_LIMIT_PLANNING_LIMIT: "3"
      RATE_LIMIT_PLANNING_WINDOW_SECONDS: "60"
